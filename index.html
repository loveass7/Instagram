<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Premium Link Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="screen">
    <div class="login-card">
      <div class="brand-mark">✦</div>
      <p class="eyebrow">PRIVATE ACCESS</p>
      <h1>Link Vault</h1>
      <p class="subtitle">Enter your credentials to continue.</p>

      <form id="loginForm" autocomplete="off">
        <input id="username" type="text" placeholder="Username" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">ENTER VAULT</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRIVATE COLLECTION</p>
        <h2>Link Vault</h2>
      </div>
      <button id="logoutBtn" class="logout">Logout</button>
    </header>

    <section class="link-grid" aria-label="Link buttons">
      <!-- Replace the image filenames and href values below. -->
      <a class="link-btn" href="https://example.com/1" target="_blank" rel="noopener">
        <img src="images/link1.jpg" alt="Link 1">
      </a>
      <a class="link-btn" href="https://example.com/2" target="_blank" rel="noopener">
        <img src="images/link2.jpg" alt="Link 2">
      </a>
      <a class="link-btn" href="https://example.com/3" target="_blank" rel="noopener">
        <img src="images/link3.jpg" alt="Link 3">
      </a>
      <a class="link-btn" href="https://example.com/4" target="_blank" rel="noopener">
        <img src="images/link4.jpg" alt="Link 4">
      </a>
      <a class="link-btn" href="https://example.com/5" target="_blank" rel="noopener">
        <img src="images/link5.jpg" alt="Link 5">
      </a>
      <a class="link-btn" href="https://example.com/6" target="_blank" rel="noopener">
        <img src="images/link6.jpg" alt="Link 6">
      </a>
      <a class="link-btn" href="https://example.com/7" target="_blank" rel="noopener">
        <img src="images/link7.jpg" alt="Link 7">
      </a>
      <a class="link-btn" href="https://example.com/8" target="_blank" rel="noopener">
        <img src="images/link8.jpg" alt="Link 8">
      </a>
      <a class="link-btn" href="https://example.com/9" target="_blank" rel="noopener">
        <img src="images/link9.jpg" alt="Link 9">
      </a>
      <a class="link-btn" href="https://example.com/10" target="_blank" rel="noopener">
        <img src="images/link10.jpg" alt="Link 10">
      </a>
    </section>

    <p class="hint">Tap an image to open its link.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
