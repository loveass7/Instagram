<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkSpace</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 110, 180, .16), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(100, 130, 255, .15), transparent 30%),
        #f7f7f8;
      color: #171717;
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .login-card {
      width: min(100%, 350px);
      background: rgba(255,255,255,.92);
      border: 1px solid #dedede;
      border-radius: 14px;
      padding: 42px 38px 30px;
      box-shadow: 0 18px 55px rgba(0,0,0,.08);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1.5px;
      text-align: center;
      margin: 0 0 34px;
    }

    .field {
      width: 100%;
      height: 42px;
      border: 1px solid #dbdbdb;
      border-radius: 7px;
      background: #fafafa;
      padding: 0 12px;
      margin-bottom: 8px;
      outline: none;
      font-size: 12px;
    }

    .field:focus {
      border-color: #aaa;
      background: white;
    }

    .login-btn {
      width: 100%;
      height: 36px;
      border: 0;
      border-radius: 8px;
      margin-top: 8px;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    .login-btn:hover { opacity: .88; transform: translateY(-1px); }

    .error {
      min-height: 18px;
      color: #d93025;
      text-align: center;
      font-size: 12px;
      margin: 10px 0 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #737373;
      font-size: 11px;
      font-weight: 700;
      margin: 25px 0;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      background: #dbdbdb;
      flex: 1;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .app { display: none; min-height: 100vh; padding: 32px 16px 50px; }
    .container { width: min(100%, 760px); margin: auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 34px;
    }

    .logo-small {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -.8px;
    }

    .logout {
      border: 1px solid #ddd;
      background: rgba(255,255,255,.8);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
    }

    .hero { text-align: center; margin-bottom: 30px; }
    .hero h1 { margin: 0 0 7px; font-size: 27px; letter-spacing: -.7px; }
    .hero p { margin: 0; color: #777; font-size: 13px; }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .link-card {
      min-width: 0;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 22px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 9px 28px rgba(0,0,0,.055);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(0,0,0,.09);
      background: #fff;
    }

    .link-image {
      width: 56px;
      height: 56px;
      min-width: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      border: 1px solid rgba(0,0,0,.08);
    }

    .link-name {
      font-size: 13px;
      font-weight: 650;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .link-arrow {
      margin-left: auto;
      color: #999;
      font-size: 17px;
      padding-left: 3px;
    }

    @media (max-width: 520px) {
      .login-card { padding: 38px 24px 28px; }
      .links { gap: 11px; }
      .link-card { padding: 10px; border-radius: 18px; gap: 9px; }
      .link-image { width: 48px; height: 48px; min-width: 48px; }
      .link-name { font-size: 12px; }
      .link-arrow { display: none; }
    }

    @media (max-width: 360px) {
      .links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <main id="loginScreen" class="screen">
    <section class="login-card">
      <h1 class="brand">LinkSpace</h1>

      <form id="loginForm">
        <input id="username" class="field" type="text" placeholder="Username" autocomplete="username" required>
        <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="login-btn" type="submit">Log in</button>
        <div id="error" class="error"></div>
      </form>

      <div class="divider">OR</div>
      <div class="hint">Private link collection<br>Sign in to continue</div>
    </section>
  </main>

  <!-- LINK PAGE -->
  <main id="app" class="app">
    <div class="container">
      <header class="topbar">
        <div class="logo-small">LinkSpace</div>
        <button id="logout" class="logout">Log out</button>
      </header>

      <section class="hero">
        <h1>My Links</h1>
        <p>Everything in one place.</p>
      </section>

      <section id="links" class="links"></section>
    </div>
  </main>

  <script>
    /*
      ============================
      EDIT YOUR LOGIN HERE
      ============================
    */
    const LOGIN_USERNAME = "admin";
    const LOGIN_PASSWORD = "/gamemode";

    /*
      ============================
      EDIT YOUR 10 LINKS HERE
      ============================

      image:
        Put a direct image URL here.
        Example:
        "https://example.com/my-photo.jpg"

      url:
        Put the website/link you want the button to open.

      name:
        Text shown beside the image.
    */
    const linkData = [
      {
        name: "My Website",
        image: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=300&q=80",
        url: "https://example.com"
      },
      {
        name: "Instagram",
        image: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=300&q=80",
        url: "https://instagram.com"
      },
      {
        name: "YouTube",
        image: "https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?w=300&q=80",
        url: "https://youtube.com"
      },
      {
        name: "Portfolio",
        image: "https://images.unsplash.com/photo-1558655146-d09347e92766?w=300&q=80",
        url: "https://example.com"
      },
      {
        name: "Telegram",
        image: "https://images.unsplash.com/photo-1611605698335-8b1569810432?w=300&q=80",
        url: "https://telegram.org"
      },
      {
        name: "GitHub",
        image: "https://images.unsplash.com/photo-1556075798-4825dfaaf498?w=300&q=80",
        url: "https://github.com"
      },
      {
        name: "WhatsApp",
        image: "https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=300&q=80",
        url: "https://whatsapp.com"
      },
      {
        name: "Store",
        image: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=300&q=80",
        url: "https://example.com"
      },
      {
        name: "Contact",
        image: "https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=300&q=80",
        url: "mailto:hello@example.com"
      },
      {
        name: "More",
        image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=300&q=80",
        url: "https://example.com"
      }
    ];

    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const loginForm = document.getElementById("loginForm");
    const error = document.getElementById("error");
    const links = document.getElementById("links");
    const logout = document.getElementById("logout");

    function showApp() {
      loginScreen.style.display = "none";
      app.style.display = "block";
      renderLinks();
    }

    function showLogin() {
      app.style.display = "none";
      loginScreen.style.display = "grid";
    }

    function renderLinks() {
      links.innerHTML = "";

      linkData.slice(0, 10).forEach(item => {
        const a = document.createElement("a");
        a.className = "link-card";
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        const img = document.createElement("img");
        img.className = "link-image";
        img.src = item.image;
        img.alt = item.name;
        img.loading = "lazy";
        img.onerror = function () {
          this.src = "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
              '<rect width="100%" height="100%" fill="#eeeeee"/>' +
              '<text x="50%" y="54%" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">IMAGE</text>' +
              '</svg>'
            );
        };

        const name = document.createElement("span");
        name.className = "link-name";
        name.textContent = item.name;

        const arrow = document.createElement("span");
        arrow.className = "link-arrow";
        arrow.textContent = "›";

        a.appendChild(img);
        a.appendChild(name);
        a.appendChild(arrow);
        links.appendChild(a);
      });
    }

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (username === LOGIN_USERNAME && password === LOGIN_PASSWORD) {
        sessionStorage.setItem("loggedIn", "true");
        error.textContent = "";
        showApp();
      } else {
        error.textContent = "Sorry, your login details are incorrect.";
      }
    });

    logout.addEventListener("click", function() {
      sessionStorage.removeItem("loggedIn");
      document.getElementById("password").value = "";
      showLogin();
    });

    if (sessionStorage.getItem("loggedIn") === "true") {
      showApp();
    }
  </script>
</body>
</html>
